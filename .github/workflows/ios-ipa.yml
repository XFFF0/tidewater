name: Build unsigned iOS IPA

on:
  push:
    branches: [ ios-wrapper ]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build web bundle
        run: |
          npm ci
          npm run build

      - name: Copy web bundle into app resources
        run: |
          rm -rf ios/TidewaterApp/dist
          cp -R dist ios/TidewaterApp/dist

      - name: Regenerate Xcode project
        run: python3 ios/generate_project.py

      - name: Stamp build id
        run: /usr/libexec/PlistBuddy -c "Add :BuildSHA string ${GITHUB_SHA::7}" ios/TidewaterApp/Info.plist

      - name: Build unsigned .app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Tidewater.xcodeproj \
            -scheme Tidewater \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | xcpretty || true

      - name: Package IPA
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Tidewater.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build failed: no .app produced" >&2
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Tidewater.ipa Payload

      - name: Commit build log (orphan branch, for sandbox log workaround)
        if: always()
        run: |
          mkdir -p /tmp/buildlog
          find ios/build -name "*.log" -exec cp {} /tmp/buildlog/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tidewater-unsigned-ipa
          path: ios/Tidewater.ipa
          retention-days: 30

      - name: Upload raw .app (for debugging failed IPA packaging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tidewater-app-debug
          path: ios/build/Build/Products/Release-iphoneos/
          retention-days: 7
